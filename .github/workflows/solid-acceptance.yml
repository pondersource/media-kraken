name: Solid browser acceptance
on:
  pull_request:
jobs:
  solid:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
      - run: npm ci
      - name: Run Solid authentication and persistence scenarios
        run: npm run cy:test
        env:
          CYPRESS_integrationFolder: cypress/integration
          CYPRESS_testFiles: auth.spec.ts
