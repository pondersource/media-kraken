name: Solid browser acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solid:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Run application unit tests
        run: npm test -- --runInBand

  playwright:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pondersource/data-modules
          ref: 49bbc7fb230936ec198a6cd19ca30566ed755809
          path: shared-data-modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: echo "NODE14_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run build
        env:
          VUE_APP_PUBLIC_PATH: /
          VUE_APP_BASE_URL: http://localhost:8080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix acceptance --no-package-lock --ignore-scripts
      - name: Install the Solid test server outside the legacy app dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/rs-css" --no-package-lock --ignore-scripts @solid/community-server@7.2.0
          echo "RS_TEST_SERVER=$RUNNER_TEMP/rs-css/node_modules/@solid/community-server/bin/server.js" >> "$GITHUB_ENV"
      - run: npx --prefix acceptance playwright install --with-deps chromium
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: shared-data-modules/movies/vanilla
      - run: pnpm exec tsc -p tsconfig.json --typeRoots ./node_modules/@types
        working-directory: shared-data-modules/movies/vanilla
      - run: npm --prefix acceptance test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: acceptance/test-results/

  build:
    needs: [solid, playwright]
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run build
        env:
          VUE_APP_PUBLIC_PATH: /
          VUE_APP_BASE_URL: https://media-kraken.pondersource.com
      - run: |
          printf '%s\n' media-kraken.pondersource.com > dist/CNAME
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

  live:
    needs: deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pondersource/data-modules
          ref: 49bbc7fb230936ec198a6cd19ca30566ed755809
          path: shared-data-modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: echo "NODE14_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix acceptance --no-package-lock --ignore-scripts
      - name: Install the Solid test server outside the legacy app dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/rs-css" --no-package-lock --ignore-scripts @solid/community-server@7.2.0
          echo "RS_TEST_SERVER=$RUNNER_TEMP/rs-css/node_modules/@solid/community-server/bin/server.js" >> "$GITHUB_ENV"
      - run: npx --prefix acceptance playwright install --with-deps chromium
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: shared-data-modules/movies/vanilla
      - run: pnpm exec tsc -p tsconfig.json --typeRoots ./node_modules/@types
        working-directory: shared-data-modules/movies/vanilla
      - name: Wait for the published origin
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 https://media-kraken.pondersource.com/
      - name: Verify live login, private persistence and published routes
        run: npm --prefix acceptance test
        env:
          ACCEPTANCE_URL: https://media-kraken.pondersource.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-results
          path: acceptance/test-results/
